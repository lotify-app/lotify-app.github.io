<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://lotify-app.github.io/en/">
    <title>Lotifybot</title>
    <meta http-equiv="refresh" content="0; url=/en/">
    <script>
        (function() {
            const supported = ["ua", "en", "pl", "de", "es", "ru"];
            
            function getLang() {
                const saved = localStorage.getItem("lotify_lang");
                if (saved && supported.includes(saved)) return saved;
                const browser = (navigator.language || navigator.userLanguage).split("-")[0].toLowerCase();
                return supported.includes(browser) ? browser : "en";
            }

            const lang = getLang();
            const target = (lang === "en") ? "/en/" : `/${lang}/`;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <!-- Empty. This page is only for language detection and redirect. -->
</body>
</html>
